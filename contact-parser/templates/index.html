<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Парсер контактов</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#6b7385; --line:#e1e4ea;
          --accent:#2457d6; --danger:#c8392b; --ok:#1f8a4c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
  label { font-weight:600; display:block; margin-bottom:8px; }
  textarea { width:100%; min-height:220px; padding:12px; border:1px solid var(--line); border-radius:8px;
             font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize:vertical; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  button { border:0; border-radius:8px; padding:10px 18px; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #start { background:var(--accent); color:#fff; }
  #stop { background:#fff; color:var(--danger); border:1px solid var(--danger); }
  .sheet { margin-left:auto; color:var(--accent); font-weight:600; text-decoration:none; }
  .sheet:hover { text-decoration:underline; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--muted); font-size:13px; }
  .stat.err b { color:var(--danger); }
  #state { margin:12px 0 0; font-weight:600; }
  #state.running { color:var(--accent); } #state.stopped { color:var(--danger); } #state.done { color:var(--ok); }
  #current { color:var(--muted); font-size:13px; word-break:break-all; min-height:1.5em; }
  #log { background:#11151c; color:#d7dce5; border-radius:8px; padding:12px; height:300px; overflow:auto;
         font:12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre-wrap; margin:0; }
  .msg { color:var(--danger); margin-top:8px; min-height:1.5em; }
</style>
</head>
<body>
<main>
  <h1>Парсер контактов</h1>
  <p class="sub">dou.ua + LinkedIn → Google Sheets (листы People и Companies)</p>

  <div class="card">
    <label for="links">Вставьте ссылки</label>
    <textarea id="links" placeholder="По одной в строке, например:
https://jobs.dou.ua/companies/epam-systems/
https://www.linkedin.com/company/grammarly/people/
https://www.linkedin.com/search/results/people/?keywords=CTO"></textarea>
    <div class="row">
      <button id="start">Запустить</button>
      <button id="stop" disabled>Остановить</button>
      {% if sheet_url %}
        <a class="sheet" href="{{ sheet_url }}" target="_blank" rel="noopener">Открыть Google Таблицу ↗</a>
      {% else %}
        <span class="sheet" style="color:var(--muted)">SHEET_ID не задан — запись в output/*.csv</span>
      {% endif %}
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="progress">0 / 0</b><span>ссылок обработано</span></div>
      <div class="stat"><b id="people">0</b><span>людей добавлено</span></div>
      <div class="stat"><b id="companies">0</b><span>компаний добавлено</span></div>
      <div class="stat err"><b id="errors">0</b><span>ошибок</span></div>
    </div>
    <p id="state">Ожидание</p>
    <div id="current"></div>
  </div>

  <div class="card">
    <label>Лог</label>
    <pre id="log"></pre>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const links = $("links");
try { links.value = localStorage.getItem("links") || ""; } catch (e) {}
links.addEventListener("input", () => { try { localStorage.setItem("links", links.value); } catch (e) {} });

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify(body || {}) });
  return r.json().catch(() => ({ ok: false, error: "Ошибка сервера" }));
}

$("start").onclick = async () => {
  $("msg").textContent = "";
  $("start").disabled = true;
  const res = await post("/start", { links: links.value });
  if (!res.ok) { $("msg").textContent = res.error; }
  refresh();
};
$("stop").onclick = async () => {
  $("stop").disabled = true;
  const res = await post("/stop");
  if (!res.ok) $("msg").textContent = res.error;
  refresh();
};

async function refresh() {
  let s;
  try { s = await (await fetch("/status")).json(); } catch (e) { return; }
  $("progress").textContent = `${s.processed} / ${s.total}`;
  $("people").textContent = s.added_people;
  $("companies").textContent = s.added_companies;
  $("errors").textContent = s.errors;
  $("start").disabled = s.running;
  $("stop").disabled = !s.running;
  const st = $("state");
  if (s.running) { st.textContent = "Идёт сбор…"; st.className = "running"; }
  else if (s.message) {
    st.textContent = s.message;
    st.className = /СТОП|прерван|Остановлено/.test(s.message) ? "stopped" : "done";
  } else { st.textContent = "Ожидание"; st.className = ""; }
  $("current").textContent = s.current ? "Сейчас: " + s.current : "";
  const log = $("log");
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.textContent = (s.log || []).join("\n");
  if (atBottom) log.scrollTop = log.scrollHeight;
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
